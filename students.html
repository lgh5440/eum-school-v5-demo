<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 학생</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .stu-toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .stu-toolbar select, .stu-toolbar input {
    padding: 7px 8px; font-size: 0.85rem;
  }
  @media (max-width: 480px) {
    .stu-toolbar { grid-template-columns: 1fr 1fr; }
    .stu-toolbar input { grid-column: 1 / -1; }
  }
  .stu-tag-filter {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .stu-tag-filter button {
    padding: 4px 10px; font-size: 0.85rem;
    background: var(--bg-input); border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill); color: var(--text-sub);
    cursor: pointer; font-family: inherit;
  }
  .stu-tag-filter button.on { background: rgba(45,212,191,0.15); border-color: var(--teal); color: var(--teal); font-weight: 700; }

  /* ─── 학생 상세 (펼침) ─── */
  .stu-row {
    margin-bottom: 6px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    border-radius: var(--radius-btn);
    transition: border-color .15s;
  }
  .stu-row .eum-row-item {
    margin-bottom: 0;
    cursor: pointer;
    background: transparent;
  }
  .stu-row.open { border-color: var(--teal); }
  .stu-row__body {
    display: none;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-input);
    border-radius: 0 0 var(--radius-btn) var(--radius-btn);
  }
  .stu-row.open .stu-row__body { display: block; }
  .stu-row.inactive { opacity: 0.55; }
  .form-line { margin-bottom: 8px; }
  .form-line label.lbl {
    display: block; font-size: 0.85rem;
    color: var(--text-sub); margin-bottom: 3px;
  }
  .form-line input, .form-line select {
    padding: 6px 8px; font-size: 0.85rem; width: 100%;
  }
  .form-grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .tag-toggle-row {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .tag-toggle-row button {
    padding: 4px 10px; font-size: 0.85rem;
    background: var(--bg-input); border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill); color: var(--text-sub);
    cursor: pointer; font-family: inherit;
  }
  .tag-toggle-row button.on.tag-newcomer { background: rgba(251,146,60,0.15); border-color: var(--orange); color: var(--orange); font-weight: 700; }
  .tag-toggle-row button.on.tag-long_absent { background: rgba(248,113,113,0.15); border-color: var(--red); color: var(--red); font-weight: 700; }
  .tag-toggle-row button.on.tag-care { background: rgba(168,85,247,0.15); border-color: var(--purple); color: var(--purple); font-weight: 700; }

  .stu-add-panel {
    background: var(--bg-soft); border: 1px solid var(--teal);
    border-radius: var(--radius-card); padding: 12px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">

  <section class="eum-c">
    <h2>👥 학생 목록 <span class="eum-badge" id="stu-count"></span></h2>
    <div class="stu-toolbar">
      <select id="filter-dept"><option value="">— 전체 부서 —</option></select>
      <select id="filter-class"><option value="">— 전체 반 —</option></select>
      <input id="search" type="search" placeholder="이름·보호자·연락처 검색" />
    </div>
    <div class="stu-tag-filter">
      <button data-tag="" class="on">전체</button>
      <button data-tag="newcomer">새친구</button>
      <button data-tag="long_absent">장기결석</button>
      <button data-tag="care">돌봄 필요</button>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 10px;">
      <button class="eum-btn eum-btn--primary" id="btn-add-toggle">＋ 학생 등록</button>
      <button class="eum-btn eum-btn--ghost" id="btn-toggle-inactive">사용 안 함 보기</button>
      <button class="eum-btn eum-btn--ghost" id="btn-refresh">새로고침</button>
    </div>

    <!-- 등록 폼 (토글) -->
    <div class="stu-add-panel" id="add-panel" style="display:none;">
      <h2 style="margin-top:0;">새 학생 등록</h2>
      <div class="form-line">
        <label class="lbl">이름 *</label>
        <input type="text" id="add-name" placeholder="홍길동" />
      </div>
      <div class="form-grid-2">
        <div class="form-line">
          <label class="lbl">학년</label>
          <input type="text" id="add-grade" placeholder="예: 초3, 중1" />
        </div>
        <div class="form-line">
          <label class="lbl">성별</label>
          <select id="add-gender">
            <option value="">선택 안 함</option>
            <option value="male">남</option>
            <option value="female">여</option>
          </select>
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-line">
          <label class="lbl">부서 *</label>
          <select id="add-dept"></select>
        </div>
        <div class="form-line">
          <label class="lbl">반</label>
          <select id="add-class"><option value="">반 선택 안 함</option></select>
        </div>
      </div>
      <div class="form-line">
        <label class="lbl">보호자 이름 <span class="hint">(선택)</span></label>
        <input type="text" id="add-parent" placeholder="예: 어머니 김OO" />
      </div>
      <div class="form-grid-2">
        <div class="form-line">
          <label class="lbl">보호자 전화번호</label>
          <input type="tel" id="add-phone" placeholder="010-0000-0000" />
        </div>
        <div class="form-line">
          <label class="lbl">관계</label>
          <input type="text" id="add-relation" placeholder="예: 어머니, 아버지" />
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="eum-btn eum-btn--primary" id="btn-add-save">등록</button>
        <button class="eum-btn eum-btn--ghost" id="btn-add-cancel">취소</button>
      </div>
    </div>

    <div id="list">
      <div class="eum-empty"><div class="msg">불러오는 중…</div></div>
    </div>
  </section>

</main>

<script src="./static/data.js"></script>
<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;

  var me = await Eum.me(true);
  if (!me) {
    document.body.innerHTML = '<p style="padding:40px; text-align:center;">로그인이 필요합니다.</p>';
    return;
  }

  EumShell.mount({
    pageId: "students", title: "이음 교회학교",
    church: me.church.name, dept: ""
  });

  var churchId = me.church.id;
  var TAG_LABELS = {
    newcomer:    ["새친구",     "orange"],
    long_absent: ["장기결석",   "red"],
    care:        ["돌봄",       "purple"]
  };

  var state = {
    depts: [], classes: [], students: [],
    filterDept: "", filterClass: "", filterTag: "", query: "",
    showInactive: false,
    expandedIds: new Set()
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function displayPhone(p) {
    if (!p) return "";
    var s = String(p).replace(/\s|-/g, "");
    if (s.startsWith("+82")) s = "0" + s.substring(3);
    var d = s.replace(/\D/g, "");
    if (d.length === 11) return d.substring(0,3) + "-" + d.substring(3,7) + "-" + d.substring(7);
    if (d.length === 10) return d.substring(0,3) + "-" + d.substring(3,6) + "-" + d.substring(6);
    return p;
  }

  function initials(name) {
    return (name && name.length >= 1) ? name.substring(0, 1) : "?";
  }

  function deptName(id) {
    var d = state.depts.find(function (x) { return x.id === id; });
    return d ? d.name : "";
  }
  function className(id) {
    var c = state.classes.find(function (x) { return x.id === id; });
    return c ? c.name : "";
  }

  function deptsActive() {
    return state.depts.filter(function (d) { return d.is_active; })
      .sort(function (a, b) { return a.sort_order - b.sort_order; });
  }
  function classesOf(deptId) {
    return state.classes.filter(function (c) { return c.department_id === deptId && c.is_active; })
      .sort(function (a, b) { return a.sort_order - b.sort_order; });
  }

  function tagBadge(tag) {
    var l = TAG_LABELS[tag];
    if (!l) return '<span class="eum-badge">' + esc(tag) + '</span>';
    return '<span class="eum-badge ' + l[1] + '">' + l[0] + '</span>';
  }

  // ─── 필터링 ───────────────────────────────────────
  function applyFilters() {
    var q = state.query.trim();
    return state.students
      .filter(function (s) { return state.showInactive || s.isActive; })
      .filter(function (s) {
        if (state.filterDept && s.departmentId !== state.filterDept) return false;
        if (state.filterClass && s.classId !== state.filterClass) return false;
        if (state.filterTag && s.tags.indexOf(state.filterTag) < 0) return false;
        if (!q) return true;
        var parentName = (s.parent && s.parent.name) || "";
        var parentPhone = (s.parent && s.parent.phone) || "";
        return s.name.indexOf(q) >= 0
            || parentName.indexOf(q) >= 0
            || parentPhone.indexOf(q) >= 0
            || displayPhone(parentPhone).indexOf(q) >= 0;
      });
  }

  // ─── 렌더 ─────────────────────────────────────────
  function renderRow(s) {
    var open = state.expandedIds.has(s.id);
    var tags = s.tags.map(tagBadge).join(" ");
    var parentLine = s.parent
      ? esc(s.parent.name) + (s.parent.relation ? " (" + esc(s.parent.relation) + ")" : "") +
        (s.parent.phone ? " · " + esc(displayPhone(s.parent.phone)) : "")
      : '<span class="hint">보호자 미등록</span>';
    var phone = s.parent && s.parent.phone || "";
    var phoneActions = phone
      ? '<a class="eum-btn eum-btn--sm" href="tel:' + esc(phone) + '" onclick="event.stopPropagation()" title="전화">📞</a>' +
        '<a class="eum-btn eum-btn--sm" href="sms:' + esc(phone) + '" onclick="event.stopPropagation()" title="문자">💬</a>'
      : '';
    var subBits = [];
    if (s.grade) subBits.push(esc(s.grade));
    var deptN = deptName(s.departmentId), classN = className(s.classId);
    if (deptN) subBits.push(esc(deptN));
    if (classN) subBits.push(esc(classN));
    subBits.push("보호자 " + parentLine);

    return '<div class="stu-row' + (open ? ' open' : '') + (s.isActive ? '' : ' inactive') + '" data-sid="' + esc(s.id) + '">' +
             '<div class="eum-row-item">' +
               '<div class="eum-row-item__avatar" data-act="toggle" data-sid="' + esc(s.id) + '">' + esc(initials(s.name)) + '</div>' +
               '<div class="eum-row-item__main" data-act="toggle" data-sid="' + esc(s.id) + '">' +
                 '<div class="eum-row-item__name">' + esc(s.name) + ' ' + tags + '</div>' +
                 '<div class="eum-row-item__sub">' + subBits.join(" · ") + '</div>' +
               '</div>' +
               '<div class="eum-row-item__actions">' + phoneActions + '</div>' +
             '</div>' +
             '<div class="stu-row__body">' +
               renderStudentEditor(s) +
             '</div>' +
           '</div>';
  }

  function renderStudentEditor(s) {
    // 부서 옵션
    var deptOpts = '<option value="">— 부서 미지정 —</option>' +
      deptsActive().map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (d.id === s.departmentId ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join("");

    // 반 옵션 — 선택된 부서의 반만
    var classOpts = '<option value="">— 반 미지정 —</option>' +
      classesOf(s.departmentId).map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === s.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      }).join("");

    // 태그
    var tagBtns = ["newcomer", "long_absent", "care"].map(function (tag) {
      var on = s.tags.indexOf(tag) >= 0;
      return '<button class="tag-' + tag + (on ? ' on' : '') + '" data-act="tag" data-sid="' + esc(s.id) + '" data-tag="' + tag + '">' +
               TAG_LABELS[tag][0] +
             '</button>';
    }).join("");

    // 보호자 영역 (1차: 첫 번째 보호자만 노출, 없으면 추가 안내)
    var parentBlock = "";
    if (s.parents && s.parents.length) {
      parentBlock = s.parents.map(function (p, idx) {
        return '<div class="form-grid-2">' +
                 '<div class="form-line">' +
                   '<label class="lbl">보호자 ' + (idx + 1) + ' 이름</label>' +
                   '<input type="text" value="' + esc(p.name) + '" data-act="p-name" data-pid="' + esc(p.id) + '" />' +
                 '</div>' +
                 '<div class="form-line">' +
                   '<label class="lbl">관계</label>' +
                   '<input type="text" value="' + esc(p.relation) + '" placeholder="예: 어머니" data-act="p-rel" data-pid="' + esc(p.id) + '" />' +
                 '</div>' +
               '</div>' +
               '<div class="form-line">' +
                 '<label class="lbl">전화번호</label>' +
                 '<input type="tel" value="' + esc(displayPhone(p.phone)) + '" placeholder="010-0000-0000" data-act="p-phone" data-pid="' + esc(p.id) + '" />' +
               '</div>';
      }).join("");
    } else {
      parentBlock = '<p class="hint">보호자가 등록돼 있지 않습니다.</p>';
    }
    parentBlock +=
      '<button class="eum-btn eum-btn--sm" data-act="add-parent" data-sid="' + esc(s.id) + '" data-fid="' + esc(s.familyId || "") + '">＋ 보호자 추가</button>';

    return '<div class="form-line">' +
             '<label class="lbl">이름</label>' +
             '<input type="text" value="' + esc(s.name) + '" data-act="s-name" data-sid="' + esc(s.id) + '" />' +
           '</div>' +
           '<div class="form-grid-2">' +
             '<div class="form-line">' +
               '<label class="lbl">학년</label>' +
               '<input type="text" value="' + esc(s.grade) + '" placeholder="예: 초3" data-act="s-grade" data-sid="' + esc(s.id) + '" />' +
             '</div>' +
             '<div class="form-line">' +
               '<label class="lbl">성별</label>' +
               '<select data-act="s-gender" data-sid="' + esc(s.id) + '">' +
                 '<option value=""' + (!s.gender ? ' selected' : '') + '>선택 안 함</option>' +
                 '<option value="male"' + (s.gender === "male" ? ' selected' : '') + '>남</option>' +
                 '<option value="female"' + (s.gender === "female" ? ' selected' : '') + '>여</option>' +
               '</select>' +
             '</div>' +
           '</div>' +
           '<div class="form-grid-2">' +
             '<div class="form-line">' +
               '<label class="lbl">부서</label>' +
               '<select data-act="s-dept" data-sid="' + esc(s.id) + '">' + deptOpts + '</select>' +
             '</div>' +
             '<div class="form-line">' +
               '<label class="lbl">반</label>' +
               '<select data-act="s-class" data-sid="' + esc(s.id) + '">' + classOpts + '</select>' +
             '</div>' +
           '</div>' +
           '<div class="form-line">' +
             '<label class="lbl">태그</label>' +
             '<div class="tag-toggle-row">' + tagBtns + '</div>' +
           '</div>' +
           '<hr style="border-color: var(--border); margin: 12px 0;" />' +
           '<h2 style="font-size:0.85rem; margin: 0 0 8px;">👨‍👩‍👧 보호자</h2>' +
           parentBlock +
           '<div style="display:flex; gap:8px; margin-top: 10px;">' +
             '<button class="eum-btn eum-btn--sm eum-btn--ghost" data-act="toggle-active" data-sid="' + esc(s.id) + '">' +
               (s.isActive ? '사용 안 함' : '다시 사용') +
             '</button>' +
           '</div>';
  }

  function render() {
    // 부서 필터 옵션 갱신
    var df = document.getElementById("filter-dept");
    var dfVal = df.value;
    df.innerHTML = '<option value="">— 전체 부서 —</option>' +
      deptsActive().map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (d.id === dfVal ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join("");

    var cf = document.getElementById("filter-class");
    var cfVal = cf.value;
    var classOpts;
    if (state.filterDept) {
      classOpts = classesOf(state.filterDept);
    } else {
      classOpts = state.classes.filter(function (c) { return c.is_active; })
        .sort(function (a, b) { return a.sort_order - b.sort_order; });
    }
    cf.innerHTML = '<option value="">— 전체 반 —</option>' +
      classOpts.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === cfVal ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      }).join("");

    var items = applyFilters();
    document.getElementById("stu-count").textContent =
      "표시 " + items.length + " · 전체 " + state.students.filter(function (s) { return state.showInactive || s.isActive; }).length;

    if (!items.length) {
      document.getElementById("list").innerHTML =
        '<div class="eum-empty">'
        + '<div class="ico">🔍</div>'
        + '<div class="msg">학생이 없습니다</div>'
        + '<div class="sub">＋ 학생 등록을 눌러 추가하세요</div>'
        + '</div>';
    } else {
      document.getElementById("list").innerHTML = items.map(renderRow).join("");
    }

    bind();
  }

  // ─── 즉시 저장 헬퍼 ──────────────────────────────
  async function saveStudent(s, patch) {
    try {
      await Data.students.update(s.id, patch);
      Object.assign(s, patch);
      Data.toast("저장됨", "ok");
    } catch (e) {
      Data.toast("저장 실패: " + (e.message || e), "err");
      throw e;
    }
  }

  function bind() {
    // 행 펼침
    document.querySelectorAll('[data-act="toggle"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-sid");
        if (state.expandedIds.has(id)) state.expandedIds.delete(id);
        else state.expandedIds.add(id);
        render();
      });
    });

    // 이름
    document.querySelectorAll('[data-act="s-name"]').forEach(function (inp) {
      var prev = inp.value;
      inp.addEventListener("change", async function () {
        var id = inp.getAttribute("data-sid");
        var s = state.students.find(function (x) { return x.id === id; });
        if (!s) return;
        var v = inp.value.trim();
        if (!v) { inp.value = prev; Data.toast("이름은 비울 수 없습니다", "err"); return; }
        try { await saveStudent(s, { name: v }); render(); } catch (_) { inp.value = prev; }
      });
    });

    // 학년
    document.querySelectorAll('[data-act="s-grade"]').forEach(function (inp) {
      inp.addEventListener("change", async function () {
        var s = state.students.find(function (x) { return x.id === inp.getAttribute("data-sid"); });
        if (!s) return;
        try { await saveStudent(s, { grade: inp.value.trim() }); }
        catch (_) {}
      });
    });

    // 성별
    document.querySelectorAll('[data-act="s-gender"]').forEach(function (sel) {
      sel.addEventListener("change", async function () {
        var s = state.students.find(function (x) { return x.id === sel.getAttribute("data-sid"); });
        if (!s) return;
        try { await saveStudent(s, { gender: sel.value }); } catch (_) {}
      });
    });

    // 부서 변경 시 반은 초기화
    document.querySelectorAll('[data-act="s-dept"]').forEach(function (sel) {
      sel.addEventListener("change", async function () {
        var s = state.students.find(function (x) { return x.id === sel.getAttribute("data-sid"); });
        if (!s) return;
        var newDept = sel.value || null;
        // 현재 반이 새 부서에 속하지 않으면 반 NULL
        var newClass = s.classId;
        if (newClass) {
          var c = state.classes.find(function (x) { return x.id === newClass; });
          if (!c || c.department_id !== newDept) newClass = null;
        }
        try {
          await saveStudent(s, { departmentId: newDept, classId: newClass });
          render();
        } catch (_) {}
      });
    });

    // 반
    document.querySelectorAll('[data-act="s-class"]').forEach(function (sel) {
      sel.addEventListener("change", async function () {
        var s = state.students.find(function (x) { return x.id === sel.getAttribute("data-sid"); });
        if (!s) return;
        var newClass = sel.value || null;
        // 반을 선택하면 부서도 자동 매핑
        var newDept = s.departmentId;
        if (newClass) {
          var c = state.classes.find(function (x) { return x.id === newClass; });
          if (c) newDept = c.department_id;
        }
        try {
          await saveStudent(s, { classId: newClass, departmentId: newDept });
          render();
        } catch (_) {}
      });
    });

    // 태그 토글
    document.querySelectorAll('[data-act="tag"]').forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var s = state.students.find(function (x) { return x.id === btn.getAttribute("data-sid"); });
        if (!s) return;
        var tag = btn.getAttribute("data-tag");
        var has = s.tags.indexOf(tag) >= 0;
        var newTags = has
          ? s.tags.filter(function (t) { return t !== tag; })
          : s.tags.concat([tag]);
        try { await saveStudent(s, { tags: newTags }); render(); } catch (_) {}
      });
    });

    // 활성/비활성
    document.querySelectorAll('[data-act="toggle-active"]').forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var s = state.students.find(function (x) { return x.id === btn.getAttribute("data-sid"); });
        if (!s) return;
        try { await saveStudent(s, { isActive: !s.isActive }); render(); } catch (_) {}
      });
    });

    // ─── 보호자 변경 ─────────────────────────────
    document.querySelectorAll('[data-act="p-name"]').forEach(function (inp) {
      var prev = inp.value;
      inp.addEventListener("change", async function () {
        var pid = inp.getAttribute("data-pid");
        var v = inp.value.trim();
        if (!v) { inp.value = prev; Data.toast("보호자 이름은 비울 수 없습니다", "err"); return; }
        try {
          await Data.familyParents.update(pid, { name: v });
          updateParentLocal(pid, { name: v });
          Data.toast("저장됨", "ok");
        } catch (e) { inp.value = prev; Data.toast("저장 실패: " + (e.message || e), "err"); }
      });
    });
    document.querySelectorAll('[data-act="p-rel"]').forEach(function (inp) {
      inp.addEventListener("change", async function () {
        var pid = inp.getAttribute("data-pid");
        try {
          await Data.familyParents.update(pid, { relation: inp.value.trim() });
          updateParentLocal(pid, { relation: inp.value.trim() });
          Data.toast("저장됨", "ok");
        } catch (e) { Data.toast("저장 실패: " + (e.message || e), "err"); }
      });
    });
    document.querySelectorAll('[data-act="p-phone"]').forEach(function (inp) {
      var prev = inp.value;
      inp.addEventListener("change", async function () {
        var pid = inp.getAttribute("data-pid");
        var raw = inp.value.trim();
        var normalized = raw ? Eum.normalizePhone(raw) : "";
        try {
          await Data.familyParents.update(pid, { phone: normalized });
          updateParentLocal(pid, { phone: normalized });
          Data.toast("저장됨", "ok");
          render();
        } catch (e) { inp.value = prev; Data.toast("저장 실패: " + (e.message || e), "err"); }
      });
    });

    // 보호자 추가
    document.querySelectorAll('[data-act="add-parent"]').forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var sid = btn.getAttribute("data-sid");
        var fid = btn.getAttribute("data-fid") || null;
        var s = state.students.find(function (x) { return x.id === sid; });
        if (!s) return;
        var pname = prompt("보호자 이름");
        if (!pname || !pname.trim()) return;
        var pphone = prompt("전화번호 (선택, 비울 수 있습니다)") || "";
        var prel = prompt("관계 (예: 어머니, 아버지, 조부모) — 선택") || "";
        try {
          // family_id가 없으면 가족부터 만들고 학생에 연결
          if (!fid) {
            var fam = await Data.families.create(churchId);
            fid = fam.id;
            await Data.students.update(s.id, { familyId: fid });
            s.familyId = fid;
          }
          var p = await Data.familyParents.create(fid, {
            name: pname, phone: pphone, relation: prel
          });
          s.parents = s.parents || [];
          s.parents.push({
            id: p.id, name: p.name, phone: p.phone || "", relation: p.relation || ""
          });
          if (!s.parent) s.parent = s.parents[0];
          Data.toast("보호자 추가 완료", "ok");
          render();
        } catch (e) {
          Data.toast("실패: " + (e.message || e), "err");
        }
      });
    });
  }

  // 보호자 로컬 갱신 (parent / parents 동기화)
  function updateParentLocal(pid, patch) {
    state.students.forEach(function (s) {
      if (!s.parents) return;
      s.parents.forEach(function (p) {
        if (p.id === pid) {
          Object.assign(p, patch);
          if (s.parent && s.parent.id === pid) Object.assign(s.parent, patch);
        }
      });
    });
  }

  // ─── 등록 폼 ──────────────────────────────────────
  function fillAddForm() {
    var deptSel = document.getElementById("add-dept");
    deptSel.innerHTML = '<option value="">— 부서 선택 —</option>' +
      deptsActive().map(function (d) {
        return '<option value="' + esc(d.id) + '">' + esc(d.name) + '</option>';
      }).join("");
    document.getElementById("add-class").innerHTML = '<option value="">반 선택 안 함</option>';
  }
  document.getElementById("add-dept").addEventListener("change", function () {
    var did = this.value;
    var cs = classesOf(did);
    document.getElementById("add-class").innerHTML = '<option value="">반 선택 안 함</option>' +
      cs.map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
      }).join("");
  });
  document.getElementById("btn-add-toggle").addEventListener("click", function () {
    var panel = document.getElementById("add-panel");
    var open = panel.style.display === "none";
    panel.style.display = open ? "" : "none";
    if (open) fillAddForm();
  });
  document.getElementById("btn-add-cancel").addEventListener("click", function () {
    document.getElementById("add-panel").style.display = "none";
  });
  document.getElementById("btn-add-save").addEventListener("click", async function () {
    var name = document.getElementById("add-name").value.trim();
    var grade = document.getElementById("add-grade").value.trim();
    var gender = document.getElementById("add-gender").value;
    var deptId = document.getElementById("add-dept").value || null;
    var classId = document.getElementById("add-class").value || null;
    var parentName = document.getElementById("add-parent").value.trim();
    var parentPhone = document.getElementById("add-phone").value.trim();
    var parentRelation = document.getElementById("add-relation").value.trim();

    if (!name) { Data.toast("학생 이름을 입력해 주세요", "err"); return; }
    if (!deptId) { Data.toast("부서를 선택해 주세요", "err"); return; }

    try {
      await Data.students.create(churchId, {
        name: name, grade: grade, gender: gender,
        departmentId: deptId, classId: classId,
        parentName: parentName, parentPhone: parentPhone, parentRelation: parentRelation,
        tags: []
      });
      Data.toast("학생 등록 완료", "ok");
      // 폼 비우기
      ["add-name","add-grade","add-parent","add-phone","add-relation"].forEach(function (id) {
        document.getElementById(id).value = "";
      });
      document.getElementById("add-gender").value = "";
      document.getElementById("add-dept").value = "";
      document.getElementById("add-class").innerHTML = '<option value="">반 선택 안 함</option>';
      document.getElementById("add-panel").style.display = "none";
      await refresh();
    } catch (e) {
      Data.toast("등록 실패: " + (e.message || e), "err");
    }
  });

  // ─── 툴바 이벤트 ──────────────────────────────────
  document.getElementById("filter-dept").addEventListener("change", function () {
    state.filterDept = this.value;
    state.filterClass = ""; // 부서 바뀌면 반 초기화
    render();
  });
  document.getElementById("filter-class").addEventListener("change", function () {
    state.filterClass = this.value;
    render();
  });
  document.getElementById("search").addEventListener("input", function () {
    state.query = this.value;
    render();
  });
  document.querySelectorAll(".stu-tag-filter button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.filterTag = btn.getAttribute("data-tag");
      document.querySelectorAll(".stu-tag-filter button").forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      render();
    });
  });
  document.getElementById("btn-toggle-inactive").addEventListener("click", function () {
    state.showInactive = !state.showInactive;
    this.textContent = state.showInactive ? "활성만 보기" : "사용 안 함 보기";
    render();
  });
  document.getElementById("btn-refresh").addEventListener("click", function () { refresh(); });

  async function refresh() {
    try {
      state.depts    = await Data.departments.list(true);
      state.classes  = await Data.classes.list(true);
      state.students = await Data.students.listAll(true);
      render();
    } catch (e) {
      console.error(e);
      Data.toast("불러오기 실패: " + (e.message || e), "err");
      document.getElementById("list").innerHTML =
        '<div class="eum-empty"><div class="ico">⚠</div>' +
        '<div class="msg">데이터를 불러올 수 없습니다</div>' +
        '<div class="sub">' + esc(e.message || String(e)) + '</div></div>';
    }
  }

  await refresh();
})();
</script>
</body>
</html>
