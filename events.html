<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 출석</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .att-toolbar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 10px;
  }
  @media (max-width: 480px) {
    .att-toolbar { grid-template-columns: 1fr; }
  }
  .att-summary {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 6px 0 10px;
    font-size: 0.85rem;
  }
  .att-summary .b {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    background: var(--bg-input);
    border-radius: var(--radius-pill);
    color: var(--text-sub);
  }
  .att-summary .b.attend { color: var(--green); }
  .att-summary .b.online { color: var(--blue); }
  .att-summary .b.absent { color: var(--red); }
  .att-summary .b.none   { color: var(--text-dim); }

  .att-empty {
    padding: 20px; text-align: center;
    color: var(--text-sub); font-size: 0.85rem;
  }

  .dot { display: inline-block; }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">
  <div style="padding:70px 20px; text-align:center; color:#8592B8; max-width:420px; margin:0 auto;">
    <div style="font-size:34px; margin-bottom:14px;">🚧</div>
    <p style="font-size:15.5px; font-weight:700; color:#3A4568; margin:0 0 8px;">출석 체크 — 라이브 데모 준비 중입니다</p>
    <p style="font-size:13px; line-height:1.7; margin:0 0 22px;">이 화면은 다음 업데이트에서 채워질 예정입니다.<br>지금은 홈 화면에서 대시보드를 살펴보세요.</p>
    <a href="./home.html" style="display:inline-block; padding:12px 22px; border-radius:12px; background:#2F73F2; color:#fff; text-decoration:none; font-size:13.5px; font-weight:700;">홈으로 돌아가기</a>
  </div>
</main>

<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;
  EumShell.mount({ pageId: "events", title: "이음 교회학교", church: "이음 교회", dept: "유년부" });
})();
</script>
</body>
</html>
