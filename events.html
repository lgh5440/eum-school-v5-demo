<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 출석</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .att-toolbar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 10px;
  }
  @media (max-width: 480px) {
    .att-toolbar { grid-template-columns: 1fr; }
  }
  .att-summary {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 6px 0 10px;
    font-size: 0.85rem;
  }
  .att-summary .b {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    background: var(--bg-input);
    border-radius: var(--radius-pill);
    color: var(--text-sub);
  }
  .att-summary .b.attend { color: var(--green); }
  .att-summary .b.online { color: var(--blue); }
  .att-summary .b.absent { color: var(--red); }
  .att-summary .b.none   { color: var(--text-dim); }

  .att-empty {
    padding: 20px; text-align: center;
    color: var(--text-sub); font-size: 0.85rem;
  }

  .dot { display: inline-block; }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">

  <!-- 주일 출석 체크 -->
  <section class="eum-c">
    <h2>✓ 주일 출석 체크</h2>
    <p class="hint">버튼을 한 번 더 누르면 해제됩니다. <strong>「출석 저장」을 눌러야 DB에 반영</strong>됩니다.</p>
    <div class="att-toolbar">
      <select id="dept"><option value="">— 부서 선택 —</option></select>
      <input id="date" type="date" />
    </div>
    <div class="att-summary" id="att-summary"></div>
    <div class="eum-att__grid" id="att-grid">
      <div class="att-empty">부서·날짜를 선택하면 학생이 표시됩니다</div>
    </div>
    <div style="display:flex; gap:8px; margin-top: 10px;">
      <button class="eum-btn eum-btn--primary" id="btn-save" style="flex:1">출석 저장</button>
      <button class="eum-btn eum-btn--ghost" id="btn-reset">변경 취소</button>
    </div>
    <div id="msg" class="hint" style="margin-top: 6px;"></div>
  </section>

  <!-- 최근 8주 -->
  <section class="eum-c">
    <h2>📅 최근 8주 출석</h2>
    <p class="hint">선택한 부서의 학생 기준. ✓ 출석 · ◐ 온라인 · ✗ 결석 · ─ 미체크</p>
    <div id="recent8w" style="overflow-x: auto;">
      <div class="att-empty">부서를 먼저 선택해 주세요</div>
    </div>
  </section>

</main>

<script src="./static/data.js"></script>
<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;

  var me = await Eum.me(true);
  if (!me) {
    document.body.innerHTML = '<p style="padding:40px; text-align:center;">로그인이 필요합니다.</p>';
    return;
  }

  EumShell.mount({
    pageId: "events", title: "이음 교회학교",
    church: me.church.name, dept: ""
  });

  var churchId = me.church.id;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  // 이번 주 일요일을 yyyy-mm-dd로
  function thisSundayISO() {
    var d = new Date();
    var dow = d.getDay();
    var diff = (7 - dow) % 7; // 다음 일요일까지
    var sun = new Date(d);
    if (diff !== 0) sun.setDate(d.getDate() + diff);
    return sun.toISOString().slice(0, 10);
  }

  // 부서별 학생 + 권한별 가시 범위 결정
  function studentsOfDept(allStudents, deptId) {
    var list = allStudents.filter(function (s) {
      return s.isActive && s.departmentId === deptId;
    });
    // 권한에 따른 추가 필터
    if (Eum.hasRole(me, "admin")) return list;
    if (Eum.hasRole(me, "manager") && me.departmentIds.indexOf(deptId) >= 0) return list;
    if (Eum.hasRole(me, "operator")) {
      return list.filter(function (s) { return me.classIds.indexOf(s.classId) >= 0; });
    }
    return [];
  }

  // ─── state ────────────────────────────────────────
  var state = {
    depts: [], classes: [], students: [],
    deptId: "", date: thisSundayISO(),
    // 현재 보고 있는 부서의 학생 출석 상태 (편집 중)
    statesMap: {},        // { studentId: 'attend'|'online'|'absent'|null }
    initialStatesMap: {}, // 원본 (변경 취소용)
    recent: null          // { weeks, byStudent }
  };

  // 날짜 input 초기값
  document.getElementById("date").value = state.date;

  // ─── 학생·이벤트 로드 ────────────────────────────
  async function loadDeptAndDate() {
    var deptId = state.deptId;
    var date = state.date;
    var grid = document.getElementById("att-grid");
    if (!deptId) {
      grid.innerHTML = '<div class="att-empty">부서·날짜를 선택하면 학생이 표시됩니다</div>';
      document.getElementById("recent8w").innerHTML = '<div class="att-empty">부서를 먼저 선택해 주세요</div>';
      updateSummary();
      return;
    }
    grid.innerHTML = '<div class="att-empty">불러오는 중…</div>';
    try {
      var students = studentsOfDept(state.students, deptId);
      if (!students.length) {
        grid.innerHTML = '<div class="att-empty">선택한 부서에 표시할 학생이 없습니다</div>';
        document.getElementById("recent8w").innerHTML = '<div class="att-empty">학생이 없습니다</div>';
        state.statesMap = {}; state.initialStatesMap = {};
        updateSummary();
        return;
      }
      var ids = students.map(function (s) { return s.id; });

      // 그 날짜 이벤트
      var events = await Data.events.listByDate(date, { studentIds: ids });
      var byStu = {};
      events.forEach(function (e) {
        // 같은 학생 같은 날짜 type 우선순위: attend > online > absent
        var rank = { attend: 3, online: 2, absent: 1 };
        var prev = byStu[e.student_id];
        if (!prev || (rank[e.type] || 0) > (rank[prev] || 0)) byStu[e.student_id] = e.type;
      });
      state.statesMap = {};
      state.initialStatesMap = {};
      ids.forEach(function (sid) {
        state.statesMap[sid] = byStu[sid] || null;
        state.initialStatesMap[sid] = byStu[sid] || null;
      });

      renderGrid(students);

      // 최근 8주
      state.recent = await Data.events.recentWeeksByStudent(ids, 8);
      renderRecent8w(students);
    } catch (e) {
      console.error(e);
      grid.innerHTML = '<div class="att-empty" style="color:var(--red)">불러오기 실패: ' + esc(e.message || String(e)) + '</div>';
    }
    document.getElementById("msg").innerHTML = "";
  }

  function renderGrid(students) {
    var rows = students.map(function (s) {
      var cur = state.statesMap[s.id];
      function st(key, label) {
        return '<button type="button" class="state '
             + (cur === key ? "on " + key : "") + '"'
             + ' data-sid="' + esc(s.id) + '" data-key="' + key + '">'
             + label + '</button>';
      }
      var gradeBadge = s.grade ? ' <span class="eum-badge">' + esc(s.grade) + '</span>' : '';
      return '<div class="eum-att__row">'
           +   '<div class="name">' + esc(s.name) + gradeBadge + '</div>'
           +   '<div class="states">'
           +     st("attend", "출석") + st("online", "온라인") + st("absent", "결석")
           +   '</div>'
           + '</div>';
    }).join("");
    document.getElementById("att-grid").innerHTML = rows;

    document.querySelectorAll(".eum-att__row .state").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sid = btn.getAttribute("data-sid");
        var key = btn.getAttribute("data-key");
        state.statesMap[sid] = (state.statesMap[sid] === key) ? null : key;
        renderGrid(students);
        updateSummary();
      });
    });

    updateSummary();
  }

  function updateSummary() {
    var c = { attend: 0, online: 0, absent: 0, none: 0 };
    Object.keys(state.statesMap).forEach(function (k) {
      c[state.statesMap[k] || "none"]++;
    });
    var dirty = Object.keys(state.statesMap).some(function (k) {
      return state.statesMap[k] !== state.initialStatesMap[k];
    });
    document.getElementById("att-summary").innerHTML =
      '<span class="b attend">출석 ' + c.attend + '</span>' +
      '<span class="b online">온라인 ' + c.online + '</span>' +
      '<span class="b absent">결석 ' + c.absent + '</span>' +
      '<span class="b none">미체크 ' + c.none + '</span>' +
      (dirty ? '<span class="b" style="color:var(--orange)">저장 안 됨</span>' : '');
  }

  function renderRecent8w(students) {
    var weeks = (state.recent && state.recent.weeks) || [];
    if (!students.length || !weeks.length) {
      document.getElementById("recent8w").innerHTML = '<div class="att-empty">데이터 없음</div>';
      return;
    }
    var byStu = (state.recent && state.recent.byStudent) || {};
    // 오래된 → 최신 순서로 표시
    var weeksAsc = weeks.slice().reverse();
    var html = '<table class="eum-8w">';
    html += '<tr><th>이름</th>';
    weeksAsc.forEach(function (w) {
      // mm/dd 표시
      var parts = w.split("-");
      html += '<th>' + Number(parts[1]) + '/' + Number(parts[2]) + '</th>';
    });
    html += '</tr>';
    students.forEach(function (s) {
      var row = '<tr><td>' + esc(s.name) + '</td>';
      weeksAsc.forEach(function (w) {
        var v = byStu[s.id] && byStu[s.id][w];
        var mark = "─", color = "var(--text-dim)";
        if (v === "attend") { mark = "✓"; color = "var(--green)"; }
        else if (v === "online") { mark = "◐"; color = "var(--blue)"; }
        else if (v === "absent") { mark = "✗"; color = "var(--red)"; }
        row += '<td style="color:' + color + '">' + mark + '</td>';
      });
      row += '</tr>';
      html += row;
    });
    html += '</table>';
    document.getElementById("recent8w").innerHTML = html;
  }

  // ─── 저장 / 초기화 ──────────────────────────────
  document.getElementById("btn-save").addEventListener("click", async function () {
    if (!state.deptId) { Data.toast("부서를 선택해 주세요", "err"); return; }
    var ids = Object.keys(state.statesMap);
    if (!ids.length) { Data.toast("저장할 학생이 없습니다", "err"); return; }
    document.getElementById("btn-save").disabled = true;
    try {
      var result = await Data.events.saveDayAttendance(churchId, state.date, state.statesMap, me.userId);
      // 갱신
      state.initialStatesMap = {};
      Object.keys(state.statesMap).forEach(function (k) {
        state.initialStatesMap[k] = state.statesMap[k];
      });
      Data.toast("출석 저장 완료 (" + result.inserted + "건)", "ok");
      updateSummary();
      // 최근 8주도 다시 로드 (오늘 변경분 반영)
      var students = studentsOfDept(state.students, state.deptId);
      state.recent = await Data.events.recentWeeksByStudent(students.map(function (s) { return s.id; }), 8);
      renderRecent8w(students);
    } catch (e) {
      console.error(e);
      Data.toast("저장 실패: " + (e.message || e), "err");
    }
    document.getElementById("btn-save").disabled = false;
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    state.statesMap = {};
    Object.keys(state.initialStatesMap).forEach(function (k) {
      state.statesMap[k] = state.initialStatesMap[k];
    });
    var students = studentsOfDept(state.students, state.deptId);
    renderGrid(students);
  });

  // ─── 툴바 ───────────────────────────────────────
  function hasUnsaved() {
    return Object.keys(state.statesMap).some(function (k) {
      return state.statesMap[k] !== state.initialStatesMap[k];
    });
  }

  document.getElementById("dept").addEventListener("change", function () {
    if (hasUnsaved() && !confirm("저장하지 않은 변경이 있습니다. 부서를 바꾸면 변경 사항이 사라집니다. 계속할까요?")) {
      this.value = state.deptId;
      return;
    }
    state.deptId = this.value;
    loadDeptAndDate();
  });
  document.getElementById("date").addEventListener("change", function () {
    if (hasUnsaved() && !confirm("저장하지 않은 변경이 있습니다. 날짜를 바꾸면 변경 사항이 사라집니다. 계속할까요?")) {
      this.value = state.date;
      return;
    }
    state.date = this.value;
    loadDeptAndDate();
  });

  // ─── 부트 ───────────────────────────────────────
  async function boot() {
    try {
      state.depts    = await Data.departments.list(true);
      state.classes  = await Data.classes.list(true);
      state.students = await Data.students.listAll(false); // 활성 학생만

      var deptSel = document.getElementById("dept");
      var activeDepts = state.depts.filter(function (d) { return d.is_active; })
        .sort(function (a, b) { return a.sort_order - b.sort_order; });
      // 권한에 따른 기본 부서: manager면 본인 부서 첫 번째, operator면 본인 반의 부서
      var defaultDept = "";
      if (Eum.hasRole(me, "manager") && me.departmentIds.length) {
        defaultDept = me.departmentIds[0];
      } else if (Eum.hasRole(me, "operator") && me.classIds.length) {
        var c = state.classes.find(function (x) { return x.id === me.classIds[0]; });
        if (c) defaultDept = c.department_id;
      }
      deptSel.innerHTML = '<option value="">— 부서 선택 —</option>' +
        activeDepts.map(function (d) {
          return '<option value="' + esc(d.id) + '"' + (d.id === defaultDept ? ' selected' : '') + '>' + esc(d.name) + '</option>';
        }).join("");
      if (defaultDept) {
        state.deptId = defaultDept;
        await loadDeptAndDate();
      }
    } catch (e) {
      console.error(e);
      Data.toast("초기 로드 실패: " + (e.message || e), "err");
    }
  }

  await boot();
})();
</script>
</body>
</html>
