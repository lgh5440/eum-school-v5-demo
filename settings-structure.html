<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 부서·반 설정</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .dept-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 12px;
    margin-bottom: 8px;
  }
  .dept-card.inactive { opacity: 0.55; }
  .dept-card__head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .dept-card__head input.dept-name {
    flex: 1; font-weight: 700; font-size: 0.95rem;
  }
  .class-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: var(--bg-input);
    border-radius: var(--radius-btn);
    margin-bottom: 4px;
  }
  .class-row input.class-name { flex: 1; font-size: 0.85rem; padding: 5px 8px; }
  .class-row .stu-count {
    font-size: 0.85rem; color: var(--text-sub);
    padding: 2px 6px; background: var(--bg-soft);
    border-radius: var(--radius-pill);
  }
  .add-class {
    margin-top: 6px;
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-sub);
    padding: 6px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    width: 100%;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .add-class:hover { color: var(--text); border-color: var(--teal); }
  .saving-indicator {
    display: inline-block; margin-left: 8px;
    font-size: 0.85rem; color: var(--text-dim);
  }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">

  <!-- 안내 -->
  <section class="eum-c">
    <h2>🏛 부서·반 설정</h2>
    <p class="hint">
      관리자만 사용할 수 있습니다. <strong>부서·반 이름은 자유롭게 정할 수 있습니다.</strong>
      예: 「유년부」도 「Kid's Zone」도 OK / 「1반」도 「사랑반」도 OK.
      모든 변경은 즉시 저장됩니다.
    </p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top: 8px;">
      <button class="eum-btn eum-btn--primary" id="btn-add-dept">＋ 부서 추가 (자유 이름)</button>
      <button class="eum-btn" id="btn-preset">표준 부서 일괄 추가 (보조)</button>
      <button class="eum-btn eum-btn--ghost" id="btn-toggle-inactive">사용 안 함 보기</button>
    </div>
  </section>

  <!-- 부서 카드 -->
  <section class="eum-c">
    <h2>📋 부서 목록 <span class="eum-badge" id="dept-count"></span></h2>
    <div id="dept-list">
      <div class="eum-empty"><div class="msg">불러오는 중…</div></div>
    </div>
  </section>

  <!-- 프리셋 다이얼로그(인라인) -->
  <section class="eum-c" id="preset-panel" style="display:none;">
    <h2>표준 부서 프리셋</h2>
    <p class="hint">교회에 사용하는 부서만 체크하고 추가하세요.</p>
    <div id="preset-list" style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;"></div>
    <div style="display:flex; gap:8px;">
      <button class="eum-btn eum-btn--primary" id="btn-preset-apply">선택한 부서 추가</button>
      <button class="eum-btn eum-btn--ghost" id="btn-preset-cancel">취소</button>
    </div>
  </section>

</main>

<script src="./static/data.js"></script>
<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;

  var me = await Eum.me(true);
  if (!me) {
    document.body.innerHTML = '<p style="padding:40px; text-align:center;">로그인이 필요합니다.</p>';
    return;
  }

  EumShell.mount({
    pageId: "all", title: "이음 교회학교",
    church: me.church.name, dept: ""
  });

  // 권한: admin만
  if (!Eum.hasRole(me, "admin")) {
    document.querySelector("main").innerHTML =
      '<section class="eum-c"><div class="eum-empty">' +
      '<div class="ico">🔒</div>' +
      '<div class="msg">관리자만 사용할 수 있습니다</div>' +
      '<div class="sub">「교회 전체」 권한이 필요합니다.</div>' +
      '</div></section>';
    return;
  }

  var churchId = me.church.id;
  var state = { depts: [], classes: [], counts: {}, showInactive: false };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  async function refresh() {
    try {
      state.depts   = await Data.departments.list(true);
      state.classes = await Data.classes.list(true);
      var ids = state.classes.map(function (c) { return c.id; });
      state.counts = await Data.classes.studentCountsBy(ids);
      render();
    } catch (e) {
      console.error(e);
      Data.toast("불러오기 실패: " + (e.message || e), "err");
    }
  }

  function render() {
    var depts = state.depts.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
    var visible = depts.filter(function (d) { return state.showInactive || d.is_active; });
    var activeCount = depts.filter(function (d) { return d.is_active; }).length;

    document.getElementById("dept-count").textContent =
      "활성 " + activeCount + " · 전체 " + depts.length;

    if (!visible.length) {
      document.getElementById("dept-list").innerHTML =
        '<div class="eum-empty">'
        + '<div class="ico">🏛</div>'
        + '<div class="msg">등록된 부서가 없습니다</div>'
        + '<div class="sub">＋ 부서 추가 또는 표준 부서 프리셋을 사용하세요</div>'
        + '</div>';
      return;
    }

    document.getElementById("dept-list").innerHTML = visible.map(function (d) {
      var classes = state.classes
        .filter(function (c) {
          return c.department_id === d.id && (state.showInactive || c.is_active);
        })
        .sort(function (a, b) { return a.sort_order - b.sort_order; });

      var classRows = classes.map(function (c) {
        var stu = state.counts[c.id] || 0;
        return '<div class="class-row" data-class-id="' + c.id + '"' +
                 (c.is_active ? '' : ' style="opacity:.5"') + '>' +
                 '<input class="class-name" type="text" value="' + esc(c.name) + '"' +
                   ' data-class-id="' + c.id + '" ' +
                   (c.is_active ? '' : 'disabled') + ' />' +
                 '<span class="stu-count">학생 ' + stu + '명</span>' +
                 '<button class="eum-btn eum-btn--sm eum-btn--ghost" data-action="toggle-class" data-class-id="' + c.id + '">' +
                   (c.is_active ? '사용 안 함' : '다시 사용') +
                 '</button>' +
               '</div>';
      }).join("");

      return '<div class="dept-card' + (d.is_active ? '' : ' inactive') + '">' +
               '<div class="dept-card__head">' +
                 '<input class="dept-name" type="text" value="' + esc(d.name) + '"' +
                   ' data-dept-id="' + d.id + '" ' +
                   (d.is_active ? '' : 'disabled') + ' />' +
                 '<button class="eum-btn eum-btn--sm eum-btn--ghost" data-action="toggle-dept" data-dept-id="' + d.id + '">' +
                   (d.is_active ? '사용 안 함' : '다시 사용') +
                 '</button>' +
               '</div>' +
               '<div>' + classRows + '</div>' +
               (d.is_active
                 ? '<button class="add-class" data-action="add-class" data-dept-id="' + d.id + '">＋ 반 추가</button>'
                 : '') +
             '</div>';
    }).join("");

    bind();
  }

  function bind() {
    // 부서 이름 변경
    document.querySelectorAll("input.dept-name").forEach(function (inp) {
      var prev = inp.value;
      inp.addEventListener("change", async function () {
        var name = inp.value.trim();
        var id = inp.getAttribute("data-dept-id");
        if (!name) { inp.value = prev; return; }
        try {
          await Data.departments.update(id, { name: name });
          Data.toast("저장됨", "ok");
          var d = state.depts.find(function (x) { return x.id === id; });
          if (d) d.name = name;
        } catch (e) {
          inp.value = prev;
          Data.toast("저장 실패: " + (e.message || e), "err");
        }
      });
    });

    // 반 이름 변경
    document.querySelectorAll("input.class-name").forEach(function (inp) {
      var prev = inp.value;
      inp.addEventListener("change", async function () {
        var name = inp.value.trim();
        var id = inp.getAttribute("data-class-id");
        if (!name) { inp.value = prev; return; }
        try {
          await Data.classes.update(id, { name: name });
          Data.toast("저장됨", "ok");
          var c = state.classes.find(function (x) { return x.id === id; });
          if (c) c.name = name;
        } catch (e) {
          inp.value = prev;
          Data.toast("저장 실패: " + (e.message || e), "err");
        }
      });
    });

    // 액션 버튼
    document.querySelectorAll("[data-action]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var act = btn.getAttribute("data-action");
        try {
          if (act === "toggle-dept") {
            var did = btn.getAttribute("data-dept-id");
            var d = state.depts.find(function (x) { return x.id === did; });
            if (!d) return;
            await Data.departments.update(did, { isActive: !d.is_active });
            await refresh();
            Data.toast(d.is_active ? "사용 안 함으로 변경" : "다시 사용으로 변경", "ok");
          } else if (act === "toggle-class") {
            var cid = btn.getAttribute("data-class-id");
            var c = state.classes.find(function (x) { return x.id === cid; });
            if (!c) return;
            await Data.classes.update(cid, { isActive: !c.is_active });
            await refresh();
            Data.toast(c.is_active ? "사용 안 함으로 변경" : "다시 사용으로 변경", "ok");
          } else if (act === "add-class") {
            var deptId = btn.getAttribute("data-dept-id");
            var existing = state.classes.filter(function (x) { return x.department_id === deptId; });
            var nextNum = existing.length + 1;
            var name = prompt("새 반 이름 (예: " + nextNum + "반 또는 사랑반)", nextNum + "반");
            if (!name) return;
            await Data.classes.create(churchId, deptId, {
              name: name.trim(),
              sortOrder: nextNum
            });
            await refresh();
            Data.toast("반 추가 완료", "ok");
          }
        } catch (e) {
          Data.toast("실패: " + (e.message || e), "err");
        }
      });
    });
  }

  // ─── 부서 추가 (자유 이름) ─────────────────────
  document.getElementById("btn-add-dept").addEventListener("click", async function () {
    var name = prompt("새 부서명을 자유롭게 입력하세요\n예: 유년부, Kid's Zone, 주일학교 1팀");
    if (!name) return;
    try {
      var maxOrder = state.depts.reduce(function (a, d) {
        return Math.max(a, d.sort_order || 0);
      }, 0);
      await Data.departments.create(churchId, {
        name: name.trim(),
        presetKey: null,
        sortOrder: maxOrder + 10,
        isActive: true
      });
      await refresh();
      Data.toast("부서 추가 완료", "ok");
    } catch (e) {
      Data.toast("실패: " + (e.message || e), "err");
    }
  });

  // ─── 프리셋 일괄 추가 ──────────────────────────
  document.getElementById("btn-preset").addEventListener("click", function () {
    var panel = document.getElementById("preset-panel");
    var willOpen = panel.style.display === "none";
    panel.style.display = willOpen ? "" : "none";
    if (willOpen) {
      var existingKeys = state.depts.map(function (d) { return d.preset_key; });
      document.getElementById("preset-list").innerHTML = Data.presets.map(function (p) {
        var already = existingKeys.indexOf(p.key) >= 0;
        return '<label class="eum-row-item" style="cursor:pointer; margin: 0;">' +
                 '<input type="checkbox" value="' + p.key + '"' +
                   (already ? ' disabled checked' : '') + ' />' +
                 '<span style="margin-left:6px">' + p.name +
                   (already ? ' <span class="eum-badge teal">이미 추가됨</span>' : '') +
                 '</span>' +
               '</label>';
      }).join("");
    }
  });

  document.getElementById("btn-preset-cancel").addEventListener("click", function () {
    document.getElementById("preset-panel").style.display = "none";
  });

  document.getElementById("btn-preset-apply").addEventListener("click", async function () {
    var checks = document.querySelectorAll("#preset-list input[type=checkbox]:checked:not(:disabled)");
    if (!checks.length) {
      Data.toast("추가할 부서를 선택하세요", "err");
      return;
    }
    try {
      for (var i = 0; i < checks.length; i++) {
        var preset = Data.presets.find(function (p) { return p.key === checks[i].value; });
        if (preset) {
          await Data.departments.create(churchId, {
            name: preset.name,
            presetKey: preset.key,
            sortOrder: preset.sortOrder,
            isActive: true
          });
        }
      }
      document.getElementById("preset-panel").style.display = "none";
      await refresh();
      Data.toast(checks.length + "개 부서 추가됨", "ok");
    } catch (e) {
      Data.toast("실패: " + (e.message || e), "err");
    }
  });

  // ─── 사용 안 함 보기 토글 ───────────────────────
  document.getElementById("btn-toggle-inactive").addEventListener("click", function () {
    state.showInactive = !state.showInactive;
    this.textContent = state.showInactive ? "활성만 보기" : "사용 안 함 보기";
    render();
  });

  await refresh();
})();
</script>
</body>
</html>
