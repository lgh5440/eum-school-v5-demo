<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 부서·반 설정</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .dept-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 12px;
    margin-bottom: 8px;
  }
  .dept-card.inactive { opacity: 0.55; }
  .dept-card__head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .dept-card__head input.dept-name {
    flex: 1; font-weight: 700; font-size: 0.95rem;
  }
  .class-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: var(--bg-input);
    border-radius: var(--radius-btn);
    margin-bottom: 4px;
  }
  .class-row input.class-name { flex: 1; font-size: 0.85rem; padding: 5px 8px; }
  .class-row .stu-count {
    font-size: 0.85rem; color: var(--text-sub);
    padding: 2px 6px; background: var(--bg-soft);
    border-radius: var(--radius-pill);
  }
  .add-class {
    margin-top: 6px;
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-sub);
    padding: 6px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    width: 100%;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .add-class:hover { color: var(--text); border-color: var(--teal); }
  .saving-indicator {
    display: inline-block; margin-left: 8px;
    font-size: 0.85rem; color: var(--text-dim);
  }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">
  <div style="padding:70px 20px; text-align:center; color:#8592B8; max-width:420px; margin:0 auto;">
    <div style="font-size:34px; margin-bottom:14px;">🚧</div>
    <p style="font-size:15.5px; font-weight:700; color:#3A4568; margin:0 0 8px;">부서·반 관리 — 라이브 데모 준비 중입니다</p>
    <p style="font-size:13px; line-height:1.7; margin:0 0 22px;">이 화면은 다음 업데이트에서 채워질 예정입니다.<br>지금은 홈 화면에서 대시보드를 살펴보세요.</p>
    <a href="./home.html" style="display:inline-block; padding:12px 22px; border-radius:12px; background:#2F73F2; color:#fff; text-decoration:none; font-size:13.5px; font-weight:700;">홈으로 돌아가기</a>
  </div>
</main>

<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;
  EumShell.mount({ pageId: "all", title: "이음 교회학교", church: "이음 교회", dept: "유년부" });
})();
</script>
</body>
</html>
