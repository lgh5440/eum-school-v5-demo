<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 돌봄</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  .filter-tabs {
    display: flex; gap: 4px;
    background: var(--bg-input);
    padding: 3px;
    border-radius: var(--radius-pill);
    margin-bottom: 10px;
  }
  .filter-tabs button {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text-sub);
    padding: 6px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-tabs button.on {
    background: var(--bg-card);
    color: var(--teal);
  }
  .prayer-li {
    align-items: flex-start !important;
  }
  .prayer-li .who-line {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 2px; flex-wrap: wrap;
  }
  .prayer-li .actions {
    margin-left: auto; display: flex; gap: 4px;
  }
  .prayer-form {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    padding: 10px;
    margin-top: 8px;
  }
  .prayer-form .radio-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .prayer-form .radio-row label {
    flex: 1; min-width: 90px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
    cursor: pointer; margin: 0;
    justify-content: center;
  }
  .prayer-form .radio-row label.on {
    background: rgba(167,139,250,0.15);
    border-color: var(--purple);
    color: var(--purple);
    font-weight: 700;
  }
  .prayer-form .radio-row input { display: none; }
  .anon-toggle {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--bg-input);
    border-radius: var(--radius-btn);
    font-size: 0.85rem;
    margin: 6px 0;
    cursor: pointer;
  }
  .anon-toggle input { width: 16px; height: 16px; margin: 0; }

  .care-form .form-grid {
    display: grid; grid-template-columns: 2fr 1fr; gap: 6px;
    margin-bottom: 8px;
  }
  @media (max-width: 480px) {
    .care-form .form-grid { grid-template-columns: 1fr; }
  }
  .care-log-li { align-items: flex-start !important; }
  .care-log-li .actions { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">
  <div style="padding:70px 20px; text-align:center; color:#8592B8; max-width:420px; margin:0 auto;">
    <div style="font-size:34px; margin-bottom:14px;">🚧</div>
    <p style="font-size:15.5px; font-weight:700; color:#3A4568; margin:0 0 8px;">결석·돌봄 알림 — 라이브 데모 준비 중입니다</p>
    <p style="font-size:13px; line-height:1.7; margin:0 0 22px;">이 화면은 다음 업데이트에서 채워질 예정입니다.<br>지금은 홈 화면에서 대시보드를 살펴보세요.</p>
    <a href="./home.html" style="display:inline-block; padding:12px 22px; border-radius:12px; background:#2F73F2; color:#fff; text-decoration:none; font-size:13.5px; font-weight:700;">홈으로 돌아가기</a>
  </div>
</main>

<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;
  EumShell.mount({ pageId: "alerts", title: "이음 교회학교", church: "이음 교회", dept: "유년부" });
})();
</script>
</body>
</html>
