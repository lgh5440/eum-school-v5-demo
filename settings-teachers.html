<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B1426" />
<title>이음 교회학교 — 교사 설정</title>
<link rel="stylesheet" href="./static/eum-shell-v2.css" />
<style>
  /* ─── 부서 그룹 ─── */
  .dept-group {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .dept-group__head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }
  .dept-group__name { flex: 1; font-weight: 700; font-size: 0.95rem; }
  .dept-group__count {
    font-size: 0.85rem; color: var(--text-sub);
    padding: 2px 8px; background: var(--bg-soft);
    border-radius: var(--radius-pill);
  }
  .dept-group__body { padding: 6px 8px; }

  /* ─── 교사 한 줄 (접힘) ─── */
  .teacher-row {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    margin-bottom: 4px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .teacher-row:hover { border-color: var(--border-strong); }
  .teacher-row.open { border-color: var(--teal); }
  .teacher-row__head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
  }
  .teacher-row__name { font-weight: 700; font-size: 0.9rem; }
  .teacher-row__chips { display: flex; gap: 3px; flex-wrap: wrap; }
  .teacher-row__chips .eum-badge { font-size: 0.85rem; padding: 1px 6px; }
  .teacher-row__scope {
    margin-left: auto; font-size: 0.85rem; color: var(--text-sub);
    text-align: right;
  }
  .teacher-row__phone-actions {
    display: flex; gap: 3px; flex-shrink: 0;
  }
  .teacher-row__phone-actions .eum-btn {
    padding: 3px 7px; font-size: 0.85rem;
  }
  .teacher-row__caret {
    font-size: 0.85rem; color: var(--text-dim); margin-left: 2px;
  }
  .teacher-row.open .teacher-row__caret { color: var(--teal); transform: rotate(180deg); }

  /* ─── 교사 상세 (펼침) ─── */
  .teacher-row__body {
    display: none;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-soft);
  }
  .teacher-row.open .teacher-row__body { display: block; }
  .teacher-row.inactive { opacity: 0.55; }

  .form-line { margin-bottom: 8px; }
  .form-line label.lbl {
    display: block; font-size: 0.85rem;
    color: var(--text-sub); margin-bottom: 3px;
  }
  .form-line input[type="text"], .form-line input[type="email"], .form-line input[type="tel"] {
    padding: 6px 8px; font-size: 0.85rem;
  }

  /* ─── 권한 묶음 칩 ─── */
  .role-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 4px;
  }
  .role-chip {
    display: flex; flex-direction: column;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-btn);
    cursor: pointer;
    transition: all .15s;
  }
  .role-chip input { display: none; }
  .role-chip .role-name {
    font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }
  .role-chip .role-desc {
    font-size: 0.85rem; color: var(--text-sub); margin-top: 2px;
  }
  .role-chip.on { background: rgba(45,212,191,0.12); border-color: var(--teal); }
  .role-chip.on .role-name { color: var(--teal); }
  .role-chip.on .role-name::before { content: "✓ "; }

  /* ─── 부서·반 배정 칩 ─── */
  .scope-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; margin: 2px;
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-size: 0.85rem; cursor: pointer;
  }
  .scope-chip input { width: 14px; height: 14px; margin: 0; }
  .scope-chip.on { background: rgba(96,165,250,0.15); border-color: var(--blue); color: var(--blue); font-weight: 700; }
  .scope-chip.disabled { opacity: 0.45; cursor: not-allowed; }

  .scope-subgroup {
    border-left: 2px solid var(--border);
    padding: 4px 0 4px 8px;
    margin-bottom: 4px;
  }
  .scope-subgroup__head {
    font-size: 0.85rem; font-weight: 600;
    color: var(--text-sub); margin-bottom: 2px;
  }

  .add-teacher-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-sub);
    padding: 8px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .add-teacher-btn:hover { color: var(--teal); border-color: var(--teal); }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:9999;background:#F0C24B;color:#1A1400;text-align:center;padding:6px 10px;font-size:12.5px;font-weight:700;font-family:sans-serif;">데모 화면 — 실제 데이터가 아닌 샘플 데이터로 동작합니다</div>

<main class="eum-main">
  <div style="padding:70px 20px; text-align:center; color:#8592B8; max-width:420px; margin:0 auto;">
    <div style="font-size:34px; margin-bottom:14px;">🚧</div>
    <p style="font-size:15.5px; font-weight:700; color:#3A4568; margin:0 0 8px;">교사·권한 관리 — 라이브 데모 준비 중입니다</p>
    <p style="font-size:13px; line-height:1.7; margin:0 0 22px;">이 화면은 다음 업데이트에서 채워질 예정입니다.<br>지금은 홈 화면에서 대시보드를 살펴보세요.</p>
    <a href="./home.html" style="display:inline-block; padding:12px 22px; border-radius:12px; background:#2F73F2; color:#fff; text-decoration:none; font-size:13.5px; font-weight:700;">홈으로 돌아가기</a>
  </div>
</main>

<script src="./static/eum-shell-v2.js"></script>
<script>
(async function () {
  if (!(await EumShell.guard())) return;
  EumShell.mount({ pageId: "all", title: "이음 교회학교", church: "이음 교회", dept: "유년부" });
})();
</script>
</body>
</html>
